<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 724" width="720" height="724" role="img" aria-label="One chat turn in Lexari" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>One chat turn in Lexari</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A0B0D"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B2BFF"/></marker></defs>
<rect width="720" height="724" rx="18" fill="#ECE8DC"/>
<text x="30" y="40" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5B2BFF">ONE TURN, START TO FINISH</text><rect x="110" y="60" width="500" height="48" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="360.0" y="89.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">1  You send a message</text><path d="M360 108L360 132" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="110" y="134" width="500" height="76" rx="14" fill="#E6DEFF" stroke="#0A0B0D" stroke-width="1.5"/><text x="360.0" y="156.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">2  Your device picks the notes</text><text x="360.0" y="175.0" text-anchor="middle" font-size="12" fill="#5D5A52">its own first, then Mentor agents, then the rest</text><text x="360.0" y="191.0" text-anchor="middle" font-size="12" fill="#5D5A52">8 notes, or 20 with Bigger memory</text><path d="M360 210L360 234" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="110" y="236" width="500" height="76" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="360.0" y="258.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">3  The server builds the prompt</text><text x="360.0" y="277.0" text-anchor="middle" font-size="12" fill="#5D5A52">persona, tone, brief, safety rules,</text><text x="360.0" y="293.0" text-anchor="middle" font-size="12" fill="#5D5A52">those notes and the last 12 messages</text><path d="M360 312L360 336" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="110" y="338" width="500" height="76" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="360.0" y="360.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">4  The model answers</text><text x="360.0" y="379.0" text-anchor="middle" font-size="12" fill="#5D5A52">streams live from the model you picked,</text><text x="360.0" y="395.0" text-anchor="middle" font-size="12" fill="#5D5A52">with a fallback if it fails before any text</text><path d="M360 414L360 438" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="110" y="440" width="500" height="64" rx="14" fill="#0A0B0D" stroke="#0A0B0D" stroke-width="1.5"/><text x="360.0" y="464.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">5  Lexari reads the tags in the reply</text><text x="360.0" y="483.0" text-anchor="middle" font-size="12" fill="#fff">computer task, command, integration, wallet</text><rect x="30" y="530" width="300" height="76" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="180.0" y="552.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Reads come back as data</text><text x="180.0" y="571.0" text-anchor="middle" font-size="12" fill="#5D5A52">results go back to the model,</text><text x="180.0" y="587.0" text-anchor="middle" font-size="12" fill="#5D5A52">which answers in plain words</text><rect x="390" y="530" width="300" height="76" rx="14" fill="#5B2BFF" stroke="#5B2BFF" stroke-width="1.5"/><text x="540.0" y="552.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Actions become a Confirm card</text><text x="540.0" y="571.0" text-anchor="middle" font-size="12" fill="#fff">sends, trades, hires and email</text><text x="540.0" y="587.0" text-anchor="middle" font-size="12" fill="#fff">wait for your tap</text><path d="M330 504L180 528" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M390 504L540 528" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="110" y="634" width="500" height="64" rx="14" fill="#E6DEFF" stroke="#0A0B0D" stroke-width="1.5"/><text x="360.0" y="658.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">6  A REMEMBER line, if any, is split off</text><text x="360.0" y="677.0" text-anchor="middle" font-size="12" fill="#5D5A52">it shows as a proposal; it is saved only if you keep it</text><path d="M180 606L300 632" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M540 606L420 632" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/></svg>