<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="Lexari architecture: app, server with the Engram brain, models, computer, integrations, wallets" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Lexari architecture: app, server with the Engram brain, models, computer, integrations, wallets</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A0B0D"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B2BFF"/></marker></defs>
<rect width="860" height="430" rx="18" fill="#ECE8DC"/>
<text x="30" y="40" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5B2BFF">HOW LEXARI FITS TOGETHER</text><rect x="30" y="70" width="200" height="70" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="130.0" y="97.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">You</text><text x="130.0" y="116.0" text-anchor="middle" font-size="12" fill="#5D5A52">Browser or Android app</text><rect x="30" y="190" width="200" height="70" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="130.0" y="217.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Lexari app</text><text x="130.0" y="236.0" text-anchor="middle" font-size="12" fill="#5D5A52">app.lexari.ai</text><path d="M130 140L130 188" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="140" y="160.0" font-size="11.5" fill="#5D5A52">chat, taps</text><rect x="300" y="150" width="240" height="150" rx="14" fill="#0A0B0D" stroke="#0A0B0D" stroke-width="1.5"/><text x="420.0" y="230.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Lexari server</text><rect x="316" y="192" width="208" height="40" rx="14" fill="#5B2BFF" stroke="#5B2BFF" stroke-width="1.5"/><text x="420.0" y="204.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Engram</text><text x="420.0" y="223.0" text-anchor="middle" font-size="12" fill="#fff">the agent brain</text><text x="420" y="262" font-size="11.5" fill="#C9C2FF" text-anchor="middle" font-weight="400">limits, budgets, Confirm</text><text x="420" y="280" font-size="11.5" fill="#C9C2FF" text-anchor="middle" font-weight="400">cards, rate limits</text><path d="M230 225L298 225" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="610" y="40" width="220" height="64" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="720.0" y="56.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Models</text><text x="720.0" y="75.0" text-anchor="middle" font-size="12" fill="#5D5A52">Lamina, Kimi, Qwen, OpenAI</text><text x="720.0" y="91.0" text-anchor="middle" font-size="12" fill="#5D5A52">or your own key</text><rect x="610" y="124" width="220" height="64" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="720.0" y="148.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Its computer</text><text x="720.0" y="167.0" text-anchor="middle" font-size="12" fill="#5D5A52">browser, terminal, files</text><rect x="610" y="208" width="220" height="64" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="720.0" y="232.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Integrations</text><text x="720.0" y="251.0" text-anchor="middle" font-size="12" fill="#5D5A52">only the ones you granted</text><rect x="610" y="292" width="220" height="64" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="720.0" y="316.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Agent wallets</text><text x="720.0" y="335.0" text-anchor="middle" font-size="12" fill="#5D5A52">test networks, after your tap</text><path d="M540 225L608 72" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M540 225L608 156" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M540 225L608 240" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M540 225L608 324" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="300" y="350" width="240" height="56" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="420.0" y="370.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Database</text><text x="420.0" y="389.0" text-anchor="middle" font-size="12" fill="#5D5A52">encrypted memories, chats</text><path d="M420 300L420 348" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="30" y="330" font-size="11.5" fill="#5D5A52" text-anchor="start" font-weight="400">Your memories are encrypted on your</text><text x="30" y="346" font-size="11.5" fill="#5D5A52" text-anchor="start" font-weight="400">device before they reach the database.</text></svg>