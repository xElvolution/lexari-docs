<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 855 410" width="855" height="410" role="img" aria-label="Engram map: memory, hippocampus, spinal cord, cortex, personality, skills, Confirm cards" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Engram map: memory, hippocampus, spinal cord, cortex, personality, skills, Confirm cards</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A0B0D"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B2BFF"/></marker></defs>
<rect width="855" height="410" rx="18" fill="#ECE8DC"/>
<text x="30" y="40" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5B2BFF">ENGRAM: THE PARTS OF THE BRAIN</text><rect x="30" y="70" width="185" height="84" rx="14" fill="#E6DEFF" stroke="#0A0B0D" stroke-width="1.5"/><text x="122.5" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Memory</text><text x="122.5" y="115.0" text-anchor="middle" font-size="12" fill="#5D5A52">notes you kept</text><text x="122.5" y="131.0" text-anchor="middle" font-size="12" fill="#5D5A52">encrypted on your device</text><path d="M215 112L233 112" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="235" y="70" width="185" height="84" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="327.5" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Hippocampus</text><text x="327.5" y="115.0" text-anchor="middle" font-size="12" fill="#5D5A52">spots one fact to remember</text><text x="327.5" y="131.0" text-anchor="middle" font-size="12" fill="#5D5A52">and proposes it</text><path d="M420 112L438 112" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="440" y="70" width="185" height="84" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="532.5" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Spinal cord</text><text x="532.5" y="115.0" text-anchor="middle" font-size="12" fill="#5D5A52">builds every prompt:</text><text x="532.5" y="131.0" text-anchor="middle" font-size="12" fill="#5D5A52">persona, rules, recall</text><path d="M625 112L643 112" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="645" y="70" width="185" height="84" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="737.5" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Cortex</text><text x="737.5" y="115.0" text-anchor="middle" font-size="12" fill="#5D5A52">streams the reply from</text><text x="737.5" y="131.0" text-anchor="middle" font-size="12" fill="#5D5A52">the model you picked</text><rect x="30" y="200" width="390" height="84" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="225.0" y="226.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Personality</text><text x="225.0" y="245.0" text-anchor="middle" font-size="12" fill="#5D5A52">name, role, tone, brief, what it calls you</text><text x="225.0" y="261.0" text-anchor="middle" font-size="12" fill="#5D5A52">set by you on the agent profile</text><rect x="440" y="200" width="385" height="84" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="632.5" y="226.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Skills and tools</text><text x="632.5" y="245.0" text-anchor="middle" font-size="12" fill="#5D5A52">skill slots on the profile; the computer,</text><text x="632.5" y="261.0" text-anchor="middle" font-size="12" fill="#5D5A52">integrations and wallet switched on per turn</text><path d="M330 200L520 156" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/><path d="M632 200L560 156" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="30" y="320" width="795" height="64" rx="14" fill="#0A0B0D" stroke="#0A0B0D" stroke-width="1.5"/><text x="427.5" y="344.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Hands: every money or email action becomes a Confirm card you tap</text><text x="427.5" y="363.0" text-anchor="middle" font-size="12" fill="#fff">reads come back as data, never as instructions</text><path d="M745 154L745 318" stroke="#5B2BFF" stroke-width="1.6" fill="none" marker-end="url(#av)"/></svg>