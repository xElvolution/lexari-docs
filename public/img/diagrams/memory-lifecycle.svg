<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 280" width="890" height="280" role="img" aria-label="Memory lifecycle: propose, keep, encrypt, store, recall, forget" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Memory lifecycle: propose, keep, encrypt, store, recall, forget</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A0B0D"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B2BFF"/></marker></defs>
<rect width="890" height="280" rx="18" fill="#ECE8DC"/>
<text x="30" y="40" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5B2BFF">A MEMORY'S LIFE</text><rect x="30" y="70" width="160" height="84" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="110.0" y="96.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">Propose</text><text x="110.0" y="115.0" text-anchor="middle" font-size="12" fill="#5D5A52">the reply ends with</text><text x="110.0" y="131.0" text-anchor="middle" font-size="12" fill="#5D5A52">REMEMBER: one fact</text><path d="M190 112L204 112" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="206" y="70" width="160" height="84" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="286.0" y="96.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">Keep</text><text x="286.0" y="115.0" text-anchor="middle" font-size="12" fill="#5D5A52">you tap keep,</text><text x="286.0" y="131.0" text-anchor="middle" font-size="12" fill="#5D5A52">or ignore it</text><path d="M366 112L380 112" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="382" y="70" width="160" height="84" rx="14" fill="#E6DEFF" stroke="#0A0B0D" stroke-width="1.5"/><text x="462.0" y="96.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">Encrypt</text><text x="462.0" y="115.0" text-anchor="middle" font-size="12" fill="#5D5A52">on your device, with a key</text><text x="462.0" y="131.0" text-anchor="middle" font-size="12" fill="#5D5A52">from a wallet signature</text><path d="M542 112L556 112" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="558" y="70" width="160" height="84" rx="14" fill="#E6DEFF" stroke="#0A0B0D" stroke-width="1.5"/><text x="638.0" y="96.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">Store</text><text x="638.0" y="115.0" text-anchor="middle" font-size="12" fill="#5D5A52">only ciphertext</text><text x="638.0" y="131.0" text-anchor="middle" font-size="12" fill="#5D5A52">and a hash</text><path d="M718 112L732 112" stroke="#0A0B0D" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="734" y="70" width="160" height="84" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="814.0" y="96.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A0B0D">Recall</text><text x="814.0" y="115.0" text-anchor="middle" font-size="12" fill="#5D5A52">decrypted on device,</text><text x="814.0" y="131.0" text-anchor="middle" font-size="12" fill="#5D5A52">sent with a message</text><rect x="30" y="190" width="400" height="66" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="230.0" y="207.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Forget</text><text x="230.0" y="226.0" text-anchor="middle" font-size="12" fill="#5D5A52">delete it in Brain; it is marked deleted and no</text><text x="230.0" y="242.0" text-anchor="middle" font-size="12" fill="#5D5A52">longer recalled</text><rect x="450" y="190" width="420" height="66" rx="14" fill="#F5F2E9" stroke="#0A0B0D" stroke-width="1.5"/><text x="660.0" y="207.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0D">Limits</text><text x="660.0" y="226.0" text-anchor="middle" font-size="12" fill="#5D5A52">100 notes per agent, 150 from level 3.</text><text x="660.0" y="242.0" text-anchor="middle" font-size="12" fill="#5D5A52">Switch memory off and the agent reads none.</text></svg>